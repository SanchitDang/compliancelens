repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff lint
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: Ruff format
        entry: uv run ruff format --check
        language: system
        types: [python]
      - id: detect-secrets
        name: Secret scan
        entry: uv run detect-secrets-hook
        args: [--no-verify, --exclude-lines, '^\s*"(sha256|chunk_id)": "[0-9a-f]{64}",?$']
        language: system
        exclude: ^(uv\.lock|infra/(spikes|environments/(dev|prod))/\.terraform\.lock\.hcl)$
