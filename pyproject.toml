[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "compliancelens"
version = "0.1.0"
description = "A source-citing assistant for public Canadian regulatory documents"
requires-python = ">=3.12,<3.13"
dependencies = [
  "beautifulsoup4>=4.13,<5",
  "boto3>=1.35,<2",
  "en-core-web-sm",
  "httpx>=0.28,<1",
  "langchain-core>=1.0,<2",
  "langchain-text-splitters>=0.3,<2",
  "langsmith>=0.4,<1",
  "openai>=1.60,<3",
  "presidio-analyzer>=2.2,<3",
  "presidio-anonymizer>=2.2,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "spacy>=3.8,<3.9",
]

[project.scripts]
compliancelens = "compliancelens.cli:main"

[dependency-groups]
dev = [
  "detect-secrets==1.5.0",
  "pre-commit>=4,<5",
  "pytest>=8,<10",
  "ruff>=0.11,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["data", ".terragrunt-cache", ".terraform"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/compliancelens"]

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
